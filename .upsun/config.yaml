applications:
  app:
    type: python:3.10
    relationships:
      database: "db:postgresql"
    web:
      upstream:
        socket_family: unix
      commands:
        start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"
      locations:
        "/":
          passthru: true
    disk: 512
    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_remote.txt

services:
  db:
    type: postgresql:15

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"